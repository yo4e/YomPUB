<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>YomPUB — 小さな本をひらく</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <header class="masthead"><a class="wordmark" href="./">YomPUB<span>よむパブ</span></a><p>小さな原稿から、本をひらく。</p><span class="draft">Core 0.1 · draft 1</span></header>
  <main>
    <section class="welcome" aria-labelledby="welcome-title">
      <div><p class="eyebrow">READABLE WITHOUT A READER</p><h1 id="welcome-title">原稿のままでも、<br>読む場所を変えても。</h1><p>横書き、縦書き、右から左へ。<br>まずは三冊の短い本で、YomPUBを試してください。</p></div>
      <div class="open-book">
        <p class="eyebrow">SAMPLE BOOKS</p>
        <div class="samples">
          <button type="button" data-sample="horizontal"><span>01</span><strong>The Small Harbour</strong><small>横書き · English · 表紙なし</small></button>
          <button type="button" data-sample="vertical"><span>02</span><strong>月の港</strong><small>日本語縦書き · ルビ · 明示表紙</small></button>
          <button type="button" data-sample="rtl"><span>03</span><strong lang="ar" dir="rtl">ضوء الميناء</strong><small>RTL · العربية · 混在テキスト</small></button>
        </div>
        <div class="local-open"><button type="button" class="file-button" data-open-input="folder">本のフォルダを開く</button><input id="folder" type="file" webkitdirectory multiple hidden><button type="button" class="file-button secondary" data-open-input="manuscript">book.mdのみ</button><input id="manuscript" type="file" accept=".md,text/markdown" hidden></div>
        <p class="hint">book.mdと画像のあるフォルダを選択。選んだファイルは、このブラウザ内だけで読みます。</p>
      </div>
    </section>
    <p id="file-status" role="status"></p>
    <div id="reader-mount"></div>
  </main>
  <footer><span>人が書ける。意味を持ち運べる。</span><span>実験的な仕様案 · 互換性の約束はまだありません</span></footer>
</body>
</html>
