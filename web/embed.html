<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YomPUB — 独立ホストでの埋め込み実証</title>
<style>
  body { margin:24px; font:16px/1.6 system-ui,sans-serif; color:#433455; background:#ece7f0; }
  button,select { padding:3px 8px; border:2px solid #76558f; background:#faf4ff; color:#433455; }
  .book { font-size:13px; color:purple; border:2px dotted purple; }
  article,p,ruby,a { text-shadow:none; }
  h1 { font-size:26px; }
  .panels { display:flex; flex-wrap:wrap; gap:24px; align-items:start; }
  .panel { width:320px; max-width:100%; min-width:0; }
  .panel.wide { width:660px; }
  .mount { box-sizing:border-box; height:620px; border:2px solid #76558f; background:#f3f1ea; }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .event { font-size:12px; min-height:20px; }
  #host-button { margin:12px 0; }
</style>
<script type="module" src="embed-demo.mjs"></script>
</head>
<body>
<h1>一つのページに、独立した読書領域を。</h1>
<p>320px幅と広い領域で、書体サイズ・配色・本の切替・閉じる・破棄をそれぞれ試せます。</p>
<p class="book" id="host-book">この枠はホスト側の .book です。読書側のCSSはここへ届きません。</p>
<h2 id="h-1">ホストの見出し（h-1）</h2>
<button id="host-button" type="button">ホストのボタン</button> <output id="host-count">0</output>
<div class="panels">
  <section class="panel" data-panel="one"><h2>読書領域 A · 320px</h2><div class="toolbar"><select aria-label="Aの本"><option value="horizontal">横書き</option><option value="vertical">縦書き＋ルビ</option><option value="rtl">RTL</option></select><button data-open type="button">開く</button><button data-destroy type="button">破棄</button><button data-create type="button">再生成</button></div><p class="event" aria-live="polite"></p><div class="mount" id="mount-one"></div></section>
  <section class="panel wide" data-panel="two"><h2>読書領域 B · 可変幅</h2><div class="toolbar"><select aria-label="Bの本"><option value="horizontal">横書き</option><option value="vertical" selected>縦書き＋ルビ</option><option value="rtl">RTL</option></select><button data-open type="button">開く</button><button data-destroy type="button">破棄</button><button data-create type="button">再生成</button></div><p class="event" aria-live="polite"></p><div class="mount" id="mount-two"></div></section>
  <section class="panel wide" data-panel="three"><h2>読書領域 C · RTL</h2><div class="toolbar"><select aria-label="Cの本"><option value="horizontal">横書き</option><option value="vertical">縦書き＋ルビ</option><option value="rtl" selected>RTL</option></select><button data-open type="button">開く</button><button data-destroy type="button">破棄</button><button data-create type="button">再生成</button></div><p class="event" aria-live="polite"></p><div class="mount" id="mount-three"></div></section>
</div>
<p>実験的なAPIです。操作対象は各読書領域だけで、ゲーム進行やホスト全体の入力管理は含みません。</p>
</body>
</html>
