name: Prototype checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Core and reader (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate the three publications
        run: npm run validate -- samples/horizontal/book.md samples/vertical/book.md samples/rtl/book.md
      - name: Install headless browsers and system dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Exercise browser layouts and loading lifecycle
        run: npm run test:ui
      - name: Repeat folder edits and reloads in WebKit
        run: npx playwright test --project=webkit-desktop --grep 'local folder load' --repeat-each=5 --output=test-results/reload
      - name: Verify project-site paths
        run: npm run test:ui
        env:
          BASE_PATH: /YomPUB/
          PORT: '4186'
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
